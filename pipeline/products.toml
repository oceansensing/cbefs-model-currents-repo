# What this repository publishes: CBEFS currents — at the surface, averaged over the whole water column, and at the bottom — from VIMS's Chesapeake Bay
# Environmental Forecast System (CBEFS), read by OPeNDAP from tds.vims.edu —
# published, not drawn on the website's map (the owner, 2026-09-27). Cite
# CBEFS and the Virginia Institute of Marine Science wherever it is shown:
# the data's license asks exactly that, and every header's `source` says it.
#
# The fetcher is the site's `scripts/fetch-cbefs.py`, shared by the three
# CBEFS repositories: this step is scoped with `--only=` to this repository's
# products, or the write fence refuses the run.
#
# - **Every `roots` entry must be one the site's `test-schema.mjs --roots`
#   publishes**, or the orchestrator exits 2.
# - **Paths are relative to the site checkout**: `scripts/...`.
# - **One regional grid per root at 0.007 degree**, `regional: true`, no
#   tiles; about 0.8 MB a field (1.4 MB for the currents), measured
#   2026-09-27. A bottom root's header carries no depth: the deepest level is
#   a different depth in every cell, and the root's name says bottom.
#
# **The budget.** Each run publishes the hourly surface current at or before
# now, on a schedule every three hours: at most three hours old when
# published, plus three to the next run and GitHub's lateness. 8 hours;
# re-measure after a week.

[contract]
check = ["node", "scripts/test-schema.mjs"]
roots = ["node", "scripts/test-schema.mjs", "--roots"]

[defaults]
timeout_minutes = 20

# Named after the server all three CBEFS repositories read.
[steps.cbefs]
cmd = ["python3", "scripts/fetch-cbefs.py", "--only=cur-cbefs,cur-cbefs-depthavg,cur-cbefs-bottom,uv-cbefs"]
lane = "vims-thredds"

[products.cur-cbefs]
title = "CBEFS surface currents"
step = "cbefs"
roots = ["cur-cbefs.json"]
writes = ["cur-cbefs.json"]
max_age_hours = 8
namespace = ["python3", "scripts/fetch-cbefs.py", "--namespace", "--only=cur-cbefs"]

# **The whole column and the bottom, from the HISTORY file since
# 2026-09-28**: six-hourly snapshots of every level. The column's mean is
# ROMS's own `ubar`/`vbar`; the bottom is level 0. Both are turned east and
# north by the site's `scripts/roms.py` and held to VIMS's own surface
# velocity, to the levels' mean, and to the tide along the channel over the
# whole run. The budget: a snapshot at most six hours old when published,
# three to the next run, four of GitHub's lateness — 13 hours.

# 1.35 MB
[products.cur-cbefs-depthavg]
title = "CBEFS currents averaged over the whole water column"
step = "cbefs"
roots = ["cur-cbefs-depthavg.json"]
writes = ["cur-cbefs-depthavg.json"]
max_age_hours = 13
namespace = ["python3", "scripts/fetch-cbefs.py", "--namespace", "--only=cur-cbefs-depthavg"]

# 1.33 MB
[products.cur-cbefs-bottom]
title = "CBEFS bottom currents"
step = "cbefs"
roots = ["cur-cbefs-bottom.json"]
writes = ["cur-cbefs-bottom.json"]
max_age_hours = 13
namespace = ["python3", "scripts/fetch-cbefs.py", "--namespace", "--only=cur-cbefs-bottom"]

# **Currents at fixed depths, R2's alone** (2026-10-10; the site's fetcher, LEVELS): the model's
# own levels interpolated to the first 17 of Mercator's depths, every one its
# water reaches, one root a depth named for it to the meter, below the datum as
# the model's own fixed slices are -- written by the same step as the rest.
[products.uv-cbefs]
title = "CBEFS currents at Mercator's depths"
step = "cbefs"
roots = ["uv-cbefs-0m.json", "uv-cbefs-2m.json", "uv-cbefs-3m.json", "uv-cbefs-4m.json",
         "uv-cbefs-5m.json", "uv-cbefs-6m.json", "uv-cbefs-8m.json", "uv-cbefs-10m.json",
         "uv-cbefs-11m.json", "uv-cbefs-13m.json", "uv-cbefs-16m.json", "uv-cbefs-18m.json",
         "uv-cbefs-22m.json", "uv-cbefs-25m.json", "uv-cbefs-29m.json", "uv-cbefs-34m.json",
         "uv-cbefs-40m.json"]
writes = ["uv-cbefs-*m.json"]
max_age_hours = 30
r2_only = true
namespace = ["python3", "scripts/fetch-cbefs.py", "--namespace", "--only=uv-cbefs"]
